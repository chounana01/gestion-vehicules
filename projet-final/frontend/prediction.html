<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction de Prix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        form { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin: 10px 0 5px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        button { background-color: #4CAF50; color: white; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #result { display: none; max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Prédire le Prix d'un Véhicule</h1>
    <form id="prediction-form">
        <label for="marque">Marque</label>
        <input type="text" id="marque" placeholder="Ex : Toyota">

        <label for="annee">Année</label>
        <input type="number" id="annee" placeholder="Ex : 2020">

        <label for="kilometrage">Kilométrage</label>
        <input type="number" id="kilometrage" placeholder="Ex : 50000">

        <button type="button" onclick="predictPrice()">Prédire</button>
    </form>

    <div id="result">
        <h2>Résultat de la Prédiction</h2>
        <p id="prediction-output"></p>
    </div>

    <script>
        const apiBaseUrl = "http://localhost:3000/vehicles/predict";

        async function predictPrice() {
            const marque = document.getElementById("marque").value;
            const annee = document.getElementById("annee").value;
            const kilometrage = document.getElementById("kilometrage").value;

            if (!marque || !annee || !kilometrage) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const response = await fetch(apiBaseUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ marque, annee, kilometrage }),
                });

                if (!response.ok) throw new Error("Erreur lors de la prédiction");

                const result = await response.json();
                document.getElementById("prediction-output").innerText = `Prix estimé : ${result.predictions[0].toFixed(2)} €`;
                document.getElementById("result").style.display = "block";
            } catch (error) {
                console.error("Erreur :", error);
                alert("Une erreur est survenue lors de la prédiction.");
            }
        }
    </script>
</body>
</html>
