<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Véhicule</title>
</head>
<body>
    <h1>Modifier un Véhicule</h1>
    <form id="update-form">
        <label for="marque">Marque</label>
        <input type="text" id="marque" name="marque" required>

        <label for="modele">Modèle</label>
        <input type="text" id="modele" name="modele" required>

        <label for="annee">Année</label>
        <input type="number" id="annee" name="annee" required>

        <label for="kilometrage">Kilométrage</label>
        <input type="number" id="kilometrage" name="kilometrage" required>

        <button type="button" onclick="updateVehicle()">Mettre à jour</button>
    </form>

    <script>
        const apiBaseUrl = "http://localhost:5000/vehicles";
        const params = new URLSearchParams(window.location.search);
        const vehicleId = params.get("id");

        async function fetchVehicle() {
            const response = await fetch(`${apiBaseUrl}/${vehicleId}`);
            const vehicle = await response.json();
            document.getElementById("marque").value = vehicle.marque;
            document.getElementById("modele").value = vehicle.modele;
            document.getElementById("annee").value = vehicle.annee;
            document.getElementById("kilometrage").value = vehicle.kilometrage;
        }

        async function updateVehicle() {
            const updatedData = {
                marque: document.getElementById("marque").value,
                modele: document.getElementById("modele").value,
                annee: document.getElementById("annee").value,
                kilometrage: document.getElementById("kilometrage").value,
            };

            const response = await fetch(`${apiBaseUrl}/${vehicleId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedData),
            });

            if (response.ok) {
                alert("Véhicule mis à jour avec succès !");
                window.location.href = "resultats.html";
            } else {
                alert("Erreur lors de la mise à jour.");
            }
        }

        fetchVehicle();
    </script>
</body>
</html>
