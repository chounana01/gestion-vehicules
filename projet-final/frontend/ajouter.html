<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Véhicule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Ajouter un Nouveau Véhicule</h1>
    <form id="add-form">
        <label for="marque">Marque</label>
        <input type="text" id="marque" required>

        <label for="modele">Modèle</label>
        <input type="text" id="modele" required>

        <label for="annee">Année</label>
        <input type="number" id="annee" required>

        <label for="kilometrage">Kilométrage</label>
        <input type="number" id="kilometrage" required>

        <label for="prix">Prix</label>
        <input type="number" id="prix" required>

        <label for="couleur">Couleur</label>
        <input type="text" id="couleur" required>

        <label for="transmission">Transmission</label>
        <select id="transmission" required>
            <option value="">Sélectionnez</option>
            <option value="Manuelle">Manuelle</option>
            <option value="Automatique">Automatique</option>
        </select>

        <label for="type_de_carrosserie">Type de Carrosserie</label>
        <input type="text" id="type_de_carrosserie" required>

        <button type="button" onclick="addVehicle()">Ajouter</button>
    </form>

    <script>
        const apiBaseUrl = "http://localhost:5000/vehicles";

        async function addVehicle() {
            const marque = document.getElementById("marque").value;
            const modele = document.getElementById("modele").value;
            const annee = document.getElementById("annee").value;
            const kilometrage = document.getElementById("kilometrage").value;
            const prix = document.getElementById("prix").value;
            const couleur = document.getElementById("couleur").value;
            const transmission = document.getElementById("transmission").value;
            const typeDeCarrosserie = document.getElementById("type_de_carrosserie").value;

            if (!marque || !modele || !annee || !kilometrage || !prix || !couleur || !transmission || !typeDeCarrosserie) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const response = await fetch(apiBaseUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        marque,
                        modèle: modele,
                        année: annee,
                        kilométrage: kilometrage,
                        prix_de_vente: prix,
                        couleur,
                        transmission,
                        type_de_carrosserie: typeDeCarrosserie,
                    }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || "Erreur lors de l'ajout.");
                }

                const data = await response.json();
                alert("Véhicule ajouté avec succès !");
                window.location.href = "index.html";
            } catch (error) {
                console.error("Erreur :", error);
                alert(error.message);
            }
        }
    </script>
</body>
</html>
