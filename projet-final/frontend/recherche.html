<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Véhicules</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Recherche de Véhicules</h1>
    <form id="search-form">
        <label for="annee">Année</label>
        <input type="number" id="annee" name="annee" placeholder="Ex : 2020">

        <label for="marque">Marque</label>
        <input type="text" id="marque" name="marque" placeholder="Ex : Toyota">

        <label for="modele">Modèle</label>
        <input type="text" id="modele" name="modele" placeholder="Ex : Corolla">

        <label for="type_de_carrosserie">Type de Carrosserie</label>
        <input type="text" id="type_de_carrosserie" name="type_de_carrosserie" placeholder="Ex : Sedan">

        <label for="transmission">Transmission</label>
        <input type="text" id="transmission" name="transmission" placeholder="Ex : Automatique">

        <label for="couleur">Couleur</label>
        <input type="text" id="couleur" name="couleur" placeholder="Ex : Blanc">

        <label for="kilometrage">Kilométrage (max)</label>
        <input type="number" id="kilometrage" name="kilometrage" placeholder="Ex : 50000">

        <button type="button" onclick="redirectToResults()">Rechercher</button>
    </form>

    <script>
   function redirectToResults() {
    const annee = document.getElementById("annee").value;
    const marque = document.getElementById("marque").value;
    const modele = document.getElementById("modele").value;
    const type = document.getElementById("type_de_carrosserie").value;
    const transmission = document.getElementById("transmission").value;
    const couleur = document.getElementById("couleur").value;
    const kilometrage = document.getElementById("kilometrage").value;

    const queryParams = new URLSearchParams({
        ...(annee && { année: annee }),
        ...(marque && { marque }),
        ...(modele && { modèle }),
        ...(type && { type_de_carrosserie: type }),
        ...(transmission && { transmission }),
        ...(couleur && { couleur }),
        ...(kilometrage && { kilométrage: kilometrage }),
    });

    window.location.href = `resultats.html?${queryParams}`;
}

    </script>
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="location.href='index.html'" style="
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        ">
            Retour au Menu Principal
        </button>
    </div>
    
</body>
</html>
